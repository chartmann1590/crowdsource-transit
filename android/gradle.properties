org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# JVM toolchain is 21 (see app/build.gradle.kts — required by the Hopper AI assistant's
# litertlm-android dependency, which ships Java 21 bytecode). Disable auto-download so
# Gradle resolves it from an already-installed JDK rather than provisioning its own copy
# under ~/.gradle/jdks — on at least one Windows dev machine that provisioned copy launched
# with a broken java.io.tmpdir (resolved to C:\WINDOWS, which isn't writable), breaking
# Room's kapt annotation processor. CI already provides JDK 21 via actions/setup-java, so
# this doesn't change CI behavior; other Windows devs need a JDK 21 installed to build.
org.gradle.java.installations.auto-download=false
