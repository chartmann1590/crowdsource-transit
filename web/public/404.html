<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA shim: unknown paths land here; bounce to the app root with the
      // original path in ?path=. Query string and hash MUST survive the bounce — trip
      // share links carry their payload in the hash (/trip#d=...).
      const segment = window.location.pathname.split('/').filter(Boolean);
      const repo = segment[0];
      const path = '/' + segment.slice(1).join('/') + window.location.search;
      window.location.replace(
        '/' + repo + '/?path=' + encodeURIComponent(path) + window.location.hash
      );
    </script>
  </head>
</html>
