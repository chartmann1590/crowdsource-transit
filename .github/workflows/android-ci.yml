name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          echo "transitland.apiKey=${{ secrets.TRANSITLAND_API_KEY }}" >> android/local.properties
          echo "github.api.token=${{ secrets.GH_API_TOKEN }}" >> android/local.properties
          echo "github.repo.owner=${{ secrets.GH_REPO_OWNER }}" >> android/local.properties
          echo "github.repo.name=${{ secrets.GH_REPO_NAME }}" >> android/local.properties
          echo "admob.appId=${{ secrets.ADMOB_APP_ID }}" >> android/local.properties
          echo "admob.bannerId=${{ secrets.ADMOB_BANNER_ID }}" >> android/local.properties
          echo "admob.interstitialId=${{ secrets.ADMOB_INTERSTITIAL_ID }}" >> android/local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Run unit tests
        run: cd android && ./gradlew test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK and App Bundle (real AdMob IDs)
        run: |
          cd android && ./gradlew assembleRelease bundleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="1.0.${{ github.run_number }}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }} (versionCode ${{ github.run_number }})
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
