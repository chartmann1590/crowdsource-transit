name: Deploy ORS Proxy Worker

# The Worker is the Android app's address-routing backend (POST /geocode) and walking
# directions proxy (POST /walk), and it holds the OpenRouteService key server-side. It was
# deployed by hand with `npm run deploy` until now, which meant a change to
# workers/ors-proxy/src could merge to main and silently never reach production — breaking
# address routing for users on a released build. This workflow closes that gap.

on:
  push:
    branches: [main]
    paths:
      - 'workers/ors-proxy/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys of the same Worker race each other.
concurrency:
  group: deploy-ors-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ors-proxy

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/ors-proxy/package-lock.json

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is empty or missing."
            echo "Create a token with the 'Edit Cloudflare Workers' template and add it as a repo secret."
            exit 1
          fi
          echo "Cloudflare API token present."

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # Deploy with the repo's own pinned wrangler (from package-lock) rather than a
      # marketplace action, so CI ships with the exact version used locally.
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # A green `wrangler deploy` only means the upload succeeded. These two checks prove
      # the new code actually serves traffic, and that ORS_API_KEY is still set on the
      # Worker — a missing secret fails here rather than silently in the shipped app.
      # URL matches ORS_PROXY_BASE_URL in android/.../di/NetworkModule.kt.
      - name: Smoke test deployed Worker
        env:
          BASE_URL: https://crowdtransit-ors-proxy.charles-h-hartmann1.workers.dev
        run: |
          echo "Checking the Worker responds with its own router..."
          body="$(curl -sS --max-time 30 "${BASE_URL}/")"
          echo "GET / -> ${body}"
          if ! echo "${body}" | grep -q '"error":"not found"'; then
            echo "Unexpected response from GET / — the Worker may not be serving."
            exit 1
          fi

          echo "Checking POST /walk round-trips through OpenRouteService..."
          # Retried: a transient ORS hiccup should not fail an otherwise good deploy.
          for attempt in 1 2 3; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 \
              -X POST "${BASE_URL}/walk" \
              -H 'Content-Type: application/json' \
              -d '{"coordinates":[[-73.7562,42.6526],[-73.7550,42.6530]]}')"
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              echo "Worker deployed and serving."
              exit 0
            fi
            sleep 10
          done
          echo "POST /walk never returned 200 after 3 attempts."
          echo "If this is HTTP 500, check that ORS_API_KEY is set: npx wrangler secret put ORS_API_KEY"
          exit 1
