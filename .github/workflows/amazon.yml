name: Amazon Appstore build + emulator test
# Amazon Appstore (Fire) build of this app: same code, built with -Pstore=amazon (no Google Play
# links, no Play in-app review prompt). Run on a tablet-size emulator without Google Play
# services (like Fire). Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [amazon]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: amazon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: temurin
    - name: Compute version code and version name
      id: version
      run: |
        version_code="$(date -u +'%y%j%H%M')"
        version_name="1.0.$(date -u +'%Y%m%d.%H%M')"
        echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
        echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
        echo "ANDROID_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
        echo "ANDROID_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
    - name: Decode google-services.json
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
    - name: Decode release keystore
      run: |
        echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore.jks
    - name: Write local.properties
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
        echo "transitland.apiKey=${{ secrets.TRANSITLAND_API_KEY }}" >> android/local.properties
        echo "admob.appId=${{ secrets.ADMOB_APP_ID }}" >> android/local.properties
        echo "admob.bannerId=${{ secrets.ADMOB_BANNER_ID }}" >> android/local.properties
        echo "admob.interstitialId=${{ secrets.ADMOB_INTERSTITIAL_ID }}" >> android/local.properties
        echo "release.storeFile=release.keystore.jks" >> android/local.properties
        echo "release.storePassword=${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" >> android/local.properties
        echo "release.keyAlias=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}" >> android/local.properties
        echo "release.keyPassword=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}" >> android/local.properties
    - name: Grant execute permission to gradlew
      run: chmod +x android/gradlew
    - name: Build amazon APK (store=amazon)
      env: {}
      run: |
        set -o pipefail
        cd android && ./gradlew :app:assembleRelease -Pstore=amazon --stacktrace 2>&1 | tee -a /tmp/amz-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p amz-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" amz-apk/CrowdTransit-amazon-release.apk
        ls -la amz-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs amz-apk/CrowdTransit-amazon-release.apk | head -3 || true
        $BT/aapt2 dump badging amz-apk/CrowdTransit-amazon-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the amazon release dex:"; unzip -p amz-apk/CrowdTransit-amazon-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/amz-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/amzlog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (no Google Play services, like Fire)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        profile: Nexus 7 2013
        target: default
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/amazon/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/amazon/amazon-upload.sh /tmp/amz-out amz_CrowdTransit_r${{ github.run_number }}
    - name: Draft release with the amazon APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: amazon-${{ github.run_number }}
        name: Amazon build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: amz-apk/CrowdTransit-amazon-release.apk
