name: Direct download build (Stripe) + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with -Pstore=direct
# (Stripe Checkout instead of Google Play Billing, no Google Play links, no Play review prompt).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch:
    inputs:
      steps:
        description: steps file under .github/direct (steps-release.txt or steps-restore.txt)
        default: steps-release.txt
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: temurin
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Compute version code and version name
      id: version
      run: |
        version_code="$(date -u +'%y%j%H%M')"
        version_name="1.0.$(date -u +'%Y%m%d.%H%M')"
        echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
        echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
        echo "ANDROID_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
        echo "ANDROID_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
    - name: Decode google-services.json
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
    - name: Decode release keystore
      run: |
        echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore.jks
    - name: Write local.properties
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
        echo "transitland.apiKey=${{ secrets.TRANSITLAND_API_KEY }}" >> android/local.properties
        echo "admob.appId=${{ secrets.ADMOB_APP_ID }}" >> android/local.properties
        echo "admob.bannerId=${{ secrets.ADMOB_BANNER_ID }}" >> android/local.properties
        echo "admob.interstitialId=${{ secrets.ADMOB_INTERSTITIAL_ID }}" >> android/local.properties
        echo "release.storeFile=release.keystore.jks" >> android/local.properties
        echo "release.storePassword=${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" >> android/local.properties
        echo "release.keyAlias=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}" >> android/local.properties
        echo "release.keyPassword=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}" >> android/local.properties
    - name: Grant execute permission to gradlew
      run: chmod +x android/gradlew
    - name: Build direct APK (store=direct)
      env: {}
      run: |
        set -o pipefail
        cd android && ./gradlew :app:assembleRelease -Pstore=direct 2>&1 | tee -a /tmp/dsk-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p dsk-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" dsk-apk/CrowdTransit-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/CrowdTransit-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/CrowdTransit-direct-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/CrowdTransit-direct-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (phone, Google APIs, no Play Store)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: STEPS_FILE=${{ github.event.inputs.steps || 'steps-release.txt' }} bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_CrowdTransit_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/CrowdTransit-direct-release.apk
