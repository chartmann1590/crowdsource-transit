name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build
        run: cd web && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # actions/deploy-pages@v5 has no built-in retry, and GitHub Pages
      # deployments occasionally fail transiently ("Deployment failed, try
      # again later"). Retry up to 3 times before giving up.
      - name: Deploy attempt 1
        id: deployment1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy attempt 2
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy attempt 3
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Resolve deployment output
        id: deployment
        run: |
          if [ "${{ steps.deployment3.outcome }}" == "success" ]; then
            echo "page_url=${{ steps.deployment3.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.deployment2.outcome }}" == "success" ]; then
            echo "page_url=${{ steps.deployment2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "page_url=${{ steps.deployment1.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          fi
