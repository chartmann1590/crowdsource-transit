name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan to catch newly-disclosed vulnerabilities even with no code changes.
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze-javascript:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  analyze-kotlin:
    name: Analyze (Kotlin/Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 21, not 17: the app's Kotlin/Java toolchain is 21 (gradle.properties disables toolchain
      # auto-download), so a JDK 17 runner can't compile it.
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          else
            cp .github/ci/google-services.placeholder.json android/app/google-services.json
          fi

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Build
        run: cd android && ./gradlew compileDebugKotlin -x test

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
